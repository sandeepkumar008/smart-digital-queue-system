# Server Port
server.port=8080

# Application Info
spring.application.name=Smart Digital Queue & Crowd Prediction System

# Database Configuration (Embedded H2 for zero-config out-of-the-box execution)
# To switch to MySQL or PostgreSQL, update the datasource properties below
spring.datasource.url=jdbc:h2:file:./data/smartqueue;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console at /h2-console for direct database inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Static Resources Handling
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.smartqueue=INFO
logging.level.org.springframework.web=INFO
